name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  hub-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hub runs on both, and the Node path carries a hand-written
        # WebSocket server: it has to be exercised, not assumed
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the hub and verify the dashboard
        run: |
          RN_DEVTOOLS_TOKEN=ci ${{ matrix.runtime }} server/server.mjs &
          sleep 2
          curl -sf "http://localhost:8973/?token=ci" | grep -q "rn-devtools-hub"
          curl -sf -X POST http://127.0.0.1:8973/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q "list_devices"

      # A device really connecting is what exercises the WebSocket server;
      # a handshake can look correct and still be rejected by a real client.
      # The probe speaks raw TCP rather than the global WebSocket, which only
      # exists from Node 22 while this package supports Node 20.
      - name: A device connects over WebSocket and its events arrive
        run: |
          node scripts/ws-probe.mjs 8973
          curl -sf -X POST http://127.0.0.1:8973/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_crashes","arguments":{}}}' | grep -q "ci-probe"

      # WebSocket is not subject to CORS, so a page the developer visits
      # could otherwise announce itself as a device and receive the payload
      # of commands meant for the real app
      - name: A browser origin cannot open the device socket
        run: |
          req() {
            if [ -z "$1" ]; then
              printf 'GET / HTTP/1.1\r\nHost: 127.0.0.1:8973\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n'
            else
              printf 'GET / HTTP/1.1\r\nHost: 127.0.0.1:8973\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\nOrigin: %s\r\n\r\n' "$1"
            fi | timeout 3 nc 127.0.0.1 8973 | head -1 | tr -d '\r'
          }
          # A native device sends no Origin; RN on Android sends the hub's own URL
          req "" | grep -q "101" || { echo "a device with no Origin was refused"; exit 1; }
          req "http://127.0.0.1:8973" | grep -q "101" || { echo "a React Native Origin was refused"; exit 1; }
          req "https://evil.example.com" | grep -q "403" || { echo "a browser origin was ACCEPTED"; exit 1; }
          req "http://127.0.0.1.evil.example.com" | grep -q "403" || { echo "a lookalike origin was ACCEPTED"; exit 1; }

      # The stdio bridge cannot be unit tested: the bug it regressed on was
      # the process exiting, and killing the hub, while the answers were
      # still in flight. Only a real pipe shows that, and it shows as
      # silence rather than as an error.
      - name: The stdio bridge answers over a real pipe
        run: |
          OUT=$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node bin/rn-devtools-hub.mjs mcp --port 8996 2>/dev/null)
          echo "$OUT" | grep -q '"serverInfo"' || { echo "no initialize answer"; exit 1; }
          echo "$OUT" | grep -q "get_project_context" || { echo "no tools/list answer"; exit 1; }
          LINES=$(echo "$OUT" | grep -c '"jsonrpc"')
          [ "$LINES" = "2" ] || { echo "expected 2 answers, got $LINES (a notification must produce none)"; exit 1; }
